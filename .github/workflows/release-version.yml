name: Tasun Exact Auto Release Chain

"on":
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "**/*.html"
      - "**/*.htm"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.txt"
      - "TASUN_REBUILD"
      - "TASUN_REBUILD_STAMP"
      - ".github/workflows/release-version.yml"
      - "publish-version_tasun_project_autoscan.mjs"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: tasun-exact-auto-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TASUN_PAGES_BASE_URL: https://wutasun.github.io/Tasun

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[skip tasun-version]') }}
    name: Build exact four-page release artifact
    runs-on: ubuntu-latest
    outputs:
      release_build: ${{ steps.contract.outputs.build }}
      release_sequence: ${{ steps.contract.outputs.sequence }}
    steps:
      - name: Checkout repository with full release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require repository admin publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          permission="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" \
            --jq '.permission // "none"')"
          echo "publisher=${GITHUB_ACTOR} permission=${permission}"
          if [[ "$permission" != "admin" ]]; then
            echo "::error::Formal Tasun release is restricted to repository administrators."
            exit 1
          fi

      - name: Enforce historical highest-R release floor
        id: floor
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";
          const rank = v => Number((String(v || "").match(/r(\d+)/i) || [0,0])[1] || 0);
          const git = args => execFileSync("git", args, {encoding:"utf8", stdio:["ignore","pipe","ignore"]}).trim();
          const current = JSON.parse(fs.readFileSync("tasun-version.json","utf8"));
          const currentBuild = String(current.version || "").trim();
          const currentRank = Math.max(rank(currentBuild), Number(current.releaseSequence || 0), Number(current.release?.releaseSequence || 0));
          let best = {rank: currentRank, build: currentBuild, sha: process.env.GITHUB_SHA || "HEAD"};
          let shas = [];
          try { shas = git(["log","-n","120","--format=%H","--","tasun-version.json"]).split(/\r?\n/).filter(Boolean); } catch {}
          for (const sha of shas) {
            try {
              const data = JSON.parse(git(["show",`${sha}:tasun-version.json`]));
              const r = Math.max(rank(data.version), Number(data.releaseSequence || 0), Number(data.release?.releaseSequence || 0));
              if (r > best.rank) best = {rank:r, build:String(data.version || "").trim(), sha};
            } catch {}
          }
          const downgrade = currentRank > 0 && best.rank > currentRank;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `downgrade=${downgrade ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `floor_sha=${best.sha}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `floor_build=${best.build}\n`);
          console.log(JSON.stringify({currentBuild,currentRank,historicalFloor:best,downgrade}));
          NODE

      - name: Restore current formal seven files when an older package was uploaded
        if: steps.floor.outputs.downgrade == 'true'
        shell: bash
        env:
          FLOOR_SHA: ${{ steps.floor.outputs.floor_sha }}
        run: |
          set -euo pipefail
          echo "::warning::Older Tasun package detected. Restoring the historical highest-R formal four-page release before generating the next exact build."
          git checkout "$FLOOR_SHA" -- \
            "汐東收發文明細表.html" \
            "汐東收發文登錄表.html" \
            "汐東文件統計表.html" \
            "汐東文件管理表.html" \
            tasun-version.json \
            TASUN_REBUILD \
            TASUN_REBUILD_STAMP

      - name: Retire legacy publication paths
        shell: bash
        run: |
          set -euo pipefail
          rm -f github/workflows/release-version.yml
          rm -f release-version.yml
          rm -f .nojekyll
          test -f .github/workflows/release-version.yml
          test -f publish-version_tasun_project_autoscan.mjs

      - name: Resolve actual changed files
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          : > /tmp/tasun_changed_files.txt
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git diff-tree --no-commit-id --name-only -r HEAD >> /tmp/tasun_changed_files.txt || true
          elif [[ -n "${BEFORE:-}" && ! "$BEFORE" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE" "$HEAD" >> /tmp/tasun_changed_files.txt || true
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD" >> /tmp/tasun_changed_files.txt || true
          fi
          git diff --name-only >> /tmp/tasun_changed_files.txt || true
          awk 'NF && !seen[$0]++' /tmp/tasun_changed_files.txt > /tmp/tasun_changed_files.unique
          mv /tmp/tasun_changed_files.unique /tmp/tasun_changed_files.txt
          cat /tmp/tasun_changed_files.txt

      - name: Run Tasun four-page exact autoscan
        shell: bash
        env:
          TASUN_BEFORE_SHA: ${{ github.event.before }}
          TASUN_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export TASUN_CHANGED_FILES="$(cat /tmp/tasun_changed_files.txt)"
          node publish-version_tasun_project_autoscan.mjs

      - name: Validate exact root release aliases sequence SHA and rebuild chain
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          node publish-version_tasun_project_autoscan.mjs --verify-only
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data = JSON.parse(fs.readFileSync("tasun-version.json","utf8"));
          const build = String(data.version || "").trim();
          const sequence = Number((build.match(/r(\d+)/i)||[0,0])[1]||0);
          if (!build || !sequence) throw new Error("unparseable final build");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `build=${build}\nsequence=${sequence}\n`);
          NODE

      - name: Commit generated exact version chain
        shell: bash
        env:
          RELEASE_BUILD: ${{ steps.contract.outputs.build }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "汐東收發文明細表.html" \
            "汐東收發文登錄表.html" \
            "汐東文件統計表.html" \
            "汐東文件管理表.html" \
            tasun-version.json \
            TASUN_REBUILD \
            TASUN_REBUILD_STAMP \
            .github/workflows/release-version.yml \
            publish-version_tasun_project_autoscan.mjs
          git add -A -- .nojekyll github/workflows/release-version.yml release-version.yml || true
          if git diff --cached --quiet; then
            echo "No generated release changes to commit."
          else
            git commit -m "chore(tasun): ${RELEASE_BUILD} exact auto release [skip tasun-version]"
            for attempt in 1 2 3; do
              if git push; then break; fi
              [[ "$attempt" == "3" ]] && exit 1
              git pull --rebase origin "${GITHUB_REF_NAME}"
            done
          fi

      - name: Select GitHub Actions as Pages publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow

      - name: Prepare exact static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "github/" \
            --exclude "_site/" \
            --exclude "tasun-api/" \
            --exclude "node_modules/" \
            --exclude ".nojekyll" \
            --exclude "*.zip" \
            --exclude "*.sql" \
            --exclude "wrangler.toml" \
            --exclude "publish-version*.mjs" \
            --exclude "release-version.yml"
          test -f _site/index.html
          test -f _site/tasun-version.json
          test -f "_site/汐東收發文明細表.html"
          test -f "_site/汐東收發文登錄表.html"
          test -f "_site/汐東文件統計表.html"
          test -f "_site/汐東文件管理表.html"
          if find _site -type f -size +100M -print -quit | grep -q .; then
            echo "::error::Pages artifact contains a file larger than 100 MB."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload exact static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy exact Tasun release
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify deployed four-page build sequence and SHA
    needs: [prepare, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed exact release
        shell: bash
        env:
          EXPECTED_BUILD: ${{ needs.prepare.outputs.release_build }}
          EXPECTED_SEQUENCE: ${{ needs.prepare.outputs.release_sequence }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          const base = "https://wutasun.github.io/Tasun";
          const expected = process.env.EXPECTED_BUILD;
          const expectedSequence = Number(process.env.EXPECTED_SEQUENCE || 0);
          const pages = [
            ["汐東收發文明細表.html", ["汐東收發文明細表.html", "xidong-official-doc-detail", "official-doc-detail", "official_doc_detail"]],
            ["汐東收發文登錄表.html", ["汐東收發文登錄表.html", "xidong-official-doc-register", "official-doc-register", "official_doc_register"]],
            ["汐東文件統計表.html", ["汐東文件統計表.html", "xidong-official-doc-statistics", "official-doc-statistics", "official_doc_statistics"]],
            ["汐東文件管理表.html", ["汐東文件管理表.html", "xidong-doc-manager", "xidong_doc_manager"]]
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const encodePath = file => file.split("/").map(encodeURIComponent).join("/");
          const digest = bytes => crypto.createHash("sha256").update(bytes).digest("hex");
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const nonce = `?__tasun_actions_verify=${Date.now()}_${attempt}`;
              const vr = await fetch(`${base}/tasun-version.json${nonce}`, {cache:"no-store"});
              if (!vr.ok) throw new Error(`version HTTP ${vr.status}`);
              const manifest = await vr.json();
              if (manifest.version !== expected || manifest.cacheV !== expected || manifest.buildStamp !== expected || manifest.rebuildStamp !== expected) throw new Error(`manifest build mismatch ${manifest.version || "missing"}`);
              if (Number(manifest.releaseSequence || 0) !== expectedSequence || Number(manifest.release?.releaseSequence || 0) !== expectedSequence) throw new Error("releaseSequence mismatch");

              const sr = await fetch(`${base}/TASUN_REBUILD_STAMP${nonce}`, {cache:"no-store"});
              if (!sr.ok || (await sr.text()).trim() !== expected) throw new Error("rebuild stamp mismatch");
              const rr = await fetch(`${base}/TASUN_REBUILD${nonce}`, {cache:"no-store"});
              const rebuildText = rr.ok ? await rr.text() : "";
              if (!rebuildText.includes(`version=${expected}`) || !rebuildText.includes(`releaseSequence=${expectedSequence}`)) throw new Error("rich rebuild mismatch");

              for (const [file, aliases] of pages) {
                const response = await fetch(`${base}/${encodePath(file)}${nonce}`, {cache:"no-store"});
                if (!response.ok) throw new Error(`${file} HTTP ${response.status}`);
                const bytes = Buffer.from(await response.arrayBuffer());
                const html = bytes.toString("utf8");
                const build = (html.match(/name=["']tasun-build-stamp["'][^>]+content=["']([^"']+)/i) || html.match(/TASUN_REBUILD_STAMP:([^\s<]+)/) || [])[1] || "";
                const sha = digest(bytes);
                if (build !== expected) throw new Error(`${file}: HTML build mismatch`);
                for (const alias of aliases) {
                  const e = manifest.pages?.[alias];
                  if (!e || e.file !== file || e.version !== expected || e.cacheV !== expected || e.buildStamp !== expected || e.pageBuildStamp !== expected || e.rebuildStamp !== expected || Number(e.releaseSequence || 0) !== expectedSequence || e.artifactSha256 !== sha || e.pageArtifactSha256 !== sha || e.htmlSha256 !== sha) {
                    throw new Error(`${file}: alias mismatch ${alias}`);
                  }
                }
                const mf = manifest.pageArtifactManifest?.[file];
                const mfDigest = typeof mf === "string" ? mf : (mf?.sha256 || mf?.artifactSha256 || mf?.pageArtifactSha256 || mf?.htmlSha256 || mf?.digest);
                const pb = typeof manifest.pageBuildStamp === "string" ? manifest.pageBuildStamp : manifest.pageBuildStamp?.[file];
                if (mfDigest !== sha || pb !== expected) throw new Error(`${file}: manifest SHA/build mismatch`);
              }
              console.log(`GitHub Pages exact four-page release confirmed: ${expected}`);
              process.exit(0);
            } catch (error) {
              console.log(`Attempt ${attempt}/24: ${error.message}`);
            }
            if (attempt < 24) await sleep(10000);
          }
          throw new Error(`GitHub Pages did not converge to ${expected} within the bounded verification window.`);
          NODE
