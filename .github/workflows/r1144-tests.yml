name: R1144 TDD

on:
  pull_request:
    branches: [main]
    paths:
      - "汐東收發文明細表.html"
      - "汐東收發文登錄表.html"
      - "汐東文件統計表.html"
      - "汐東文件管理表.html"
      - "tests/r1144-authority-convergence.test.cjs"
      - ".github/workflows/r1144-tests.yml"

permissions:
  contents: read

jobs:
  r1144:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/r1144-authority-convergence.test.cjs
