name: Deploy Tasun Worker to Staging

on:
  push:
    branches:
      - fix/auth-public-roster-staging-20261126
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: "Confirm target: tasun-worker-staging"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tasun-staging-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy tasun-worker-staging
    if: ${{ github.ref == 'refs/heads/fix/auth-public-roster-staging-20261126' && (github.event_name == 'push' || inputs.confirm_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6

      - name: Verify Staging-only target
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          config="tasun-api/wrangler.staging.toml"
          test -f "$config"
          grep -Fxq 'name = "tasun-worker-staging"' "$config"
          grep -Fxq 'database_id = "ca30bb1d-314a-44e3-b889-08b30a0eba27"' "$config"
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is missing."
            exit 1
          fi

      - name: Deploy using the Staging configuration
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "tasun-api"
          command: deploy --config wrangler.staging.toml
          wranglerVersion: "4"

      - name: Verify isolated Staging Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error https://tasun-worker-staging.wutasun.workers.dev/api/tasun/health -o "$RUNNER_TEMP/staging-health.json"; then
              node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(data.ok!==true || !String(data.service||"").includes("tasun-worker")) process.exit(1);' "$RUNNER_TEMP/staging-health.json"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Staging Worker health endpoint did not pass after deployment."
          exit 1
