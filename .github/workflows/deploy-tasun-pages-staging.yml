name: Deploy Tasun Staging Pages Preview
on:
  push:
    branches:
      - fix/auth-public-roster-staging-20261126
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: Confirm isolated Staging Pages preview deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tasun-staging-pages-preview
  cancel-in-progress: false

jobs:
  deploy-staging-preview:
    if: ${{ github.ref == 'refs/heads/fix/auth-public-roster-staging-20261126' && (github.event_name == 'push' || inputs.confirm_staging) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: tasun-g3-pr104-preview
      PREVIEW_BRANCH: tasun-auth-roster-preview
      PRODUCTION_WORKER_HOST: tasun-worker.wutasun.workers.dev
      STAGING_WORKER_HOST: tasun-worker-staging.wutasun.workers.dev
    steps:
      - name: Check out the isolated staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run existing regression checks
        run: node --test tests/*.test.*

      - name: Verify deployment scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/auth-public-roster-staging-20261126"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -Fxq 'name = "tasun-worker-staging"' tasun-api/wrangler.staging.toml
          grep -Fxq 'database_id = "ca30bb1d-314a-44e3-b889-08b30a0eba27"' tasun-api/wrangler.staging.toml
          grep -Fxq 'STAGING_PREVIEW_CORS_PROJECT_DOMAIN = "tasun-g3-pr104-preview.pages.dev"' tasun-api/wrangler.staging.toml
          grep -Fq 'tasun-g3-pr104-preview.pages.dev' index.html

      - name: Prepare a Staging-only static site copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git ls-files -z | grep -zEv '^(\.github/|docs/|tests/|tasun-api/)' | tar --null -T - -cf - | tar -xf - -C dist
          python3 - <<'PY'
          from pathlib import Path
          production = 'tasun-worker.wutasun.workers.dev'
          staging = 'tasun-worker-staging.wutasun.workers.dev'
          changed = 0
          remaining = []
          for path in Path('dist').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if production in text:
                  text = text.replace(production, staging)
                  path.write_text(text, encoding='utf-8')
                  changed += 1
              if production in text:
                  remaining.append(str(path))
          if changed == 0:
              raise SystemExit('No production Worker references found to redirect in the Staging copy')
          if remaining:
              raise SystemExit('Production Worker references remain in Staging copy: ' + ', '.join(remaining))
          if 'tasun-g3-pr104-preview.pages.dev' not in Path('dist/index.html').read_text(encoding='utf-8'):
              raise SystemExit('Staging Pages host detection is missing from index.html')
          if staging not in Path('dist/tasun-resources.json').read_text(encoding='utf-8'):
              raise SystemExit('Staging resource API base was not applied')
          print(f'Redirected production Worker references in {changed} static files; no production Worker host remains.')
          PY

      - name: Ensure the dedicated Pages project uses a non-production preview branch
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project list --json > "$RUNNER_TEMP/pages-projects.json"
          project_status="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const projects = Array.isArray(data) ? data : (data.result || data.projects);
            if (!Array.isArray(projects)) throw new Error("Unexpected Pages project list format");
            const project = projects.find(item => item.name === process.env.PAGES_PROJECT);
            if (!project) { console.log("missing"); process.exit(0); }
            const production = project.production_branch || project.productionBranch || "";
            if (!production) throw new Error("Cannot verify existing Pages production branch; stopping safely");
            if (production === process.env.PREVIEW_BRANCH) throw new Error("Refusing to deploy the selected alias as the production branch");
            console.log("exists");
          ' "$RUNNER_TEMP/pages-projects.json")"
          if [[ "$project_status" == "missing" ]]; then
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch "tasun-staging-placeholder-never-published"
          elif [[ "$project_status" != "exists" ]]; then
            echo "Unexpected Pages project status: $project_status" >&2
            exit 1
          fi

      - name: Deploy only the Staging preview branch
        shell: bash
        run: |
          set -euo pipefail
          preview_url="https://${PREVIEW_BRANCH}.${PAGES_PROJECT}.pages.dev"
          test "$PREVIEW_BRANCH" != "tasun-staging-placeholder-never-published"
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Staging auth roster preview" \
            --skip-caching \
           
          printf '\nStaging preview URL: %s\n' "$preview_url" | tee -a "$GITHUB_STEP_SUMMARY"
          ready=0
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 "$preview_url/" -o /dev/null; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          echo 'Staging Pages preview returned HTTP 200.'
