name: Tasun regression checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify committed GitHub SHA-256 checksums
        run: node --test tests/r1157-github-checksum-audit.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify R1157 staging tooling safety (offline, no cloud calls)
        working-directory: tools/staging
        run: python -m unittest -v test_gate4a2_safety test_operator_v8 test_pages_json_regression
      - name: Verify R1157 P1 Session Version (offline RED/GREEN regression)
        run: |
          node --test tools/staging/tests/test_session_version.mjs
          python -m unittest discover -s tools/staging/tests -p 'test_session_version_migration.py' -v
      - name: Run release and runtime regression tests
        run: node --test tests/*.test.*
      - name: Generate disposable exact release and verify without publishing
        run: |
          TASUN_CHANGED_FILES=publish-version_tasun_project_autoscan.mjs node publish-version_tasun_project_autoscan.mjs
          node publish-version_tasun_project_autoscan.mjs --verify-only
          node --test tests/*.test.*
