name: Tasun regression checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release and runtime regression tests
        run: node --test tests/*.test.*
      - name: Generate disposable exact release and verify without publishing
        run: |
          TASUN_CHANGED_FILES=publish-version_tasun_project_autoscan.mjs node publish-version_tasun_project_autoscan.mjs
          node publish-version_tasun_project_autoscan.mjs --verify-only
          node --test tests/*.test.*
