# G3 REVIEW-ONLY: local developer entry, not a Production or Staging deployment file.
# Run only with: wrangler dev --local --config wrangler.g3-local.toml
# DO NOT use wrangler deploy. No real Cloudflare D1 ID or secrets are supplied.
name = "tasun-g3-local-review-only"
main = "tasun-worker-stable-v4.js"
compatibility_date = "2026-02-14"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "tasun-g3-local-only"
database_id = "00000000-0000-0000-0000-000000000000"
