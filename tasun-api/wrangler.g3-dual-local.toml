# G3 LOCAL REVIEW HARNESS ONLY. Never deploy to Production or Staging.
# Suggested test: wrangler dev --local --config wrangler.g3-dual-local.toml
# Leave the formal wrangler.toml untouched; all IDs below are local placeholders.
name = "tasun-g3-dual-local-review-only"
main = "g3-dual-api-local.js"
compatibility_date = "2026-02-14"
workers_dev = false

[[d1_databases]]
binding = "G3_DB"
database_name = "tasun-g3-local-only"
database_id = "00000000-0000-0000-0000-000000000001"

[[d1_databases]]
binding = "LEGACY_DB"
database_name = "tasun-legacy-local-only"
database_id = "00000000-0000-0000-0000-000000000002"

[vars]
G3_CORS_ALLOW_ORIGINS = "http://localhost:8787"
LOCAL_ALLOWED_ORIGIN = "http://localhost:8787"
LOCAL_ACCESS_TEAM_DOMAIN = "https://invalid.localhost"
LOCAL_ACCESS_POLICY_AUD = "UNCONFIGURED_LOCAL_ONLY"
# No AUTH_SECRET is embedded. Local testing can inject G3_AUTH_SECRET via .dev.vars.
